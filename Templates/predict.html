<!DOCTYPE html>
<html>
<head>
    <title>Disease Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="col-md-6 offset-md-3 card p-4">
        <h3 class="text-center mb-3">Disease Prediction</h3>
        <p class="text-center text-muted">Select your symptoms</p>
        <form method="POST">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="fever" value="1">
                <label class="form-check-label">Fever</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="cough" value="1">
                <label class="form-check-label">Cough</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="headache" value="1">
                <label class="form-check-label">Headache</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="fatigue" value="1">
                <label class="form-check-label">Fatigue</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="body_pain" value="1">
                <label class="form-check-label">Body Pain</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="sore_throat" value="1">
                <label class="form-check-label">Sore Throat</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="nausea" value="1">
                <label class="form-check-label">Nausea</label>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="rash" value="1">
                <label class="form-check-label">Skin Rash</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Predict Disease</button>
        </form>

        {% if result %}
        <div class="alert alert-success mt-3 text-center">
            <strong>Predicted Disease: {{ result }}</strong>
        </div>
        {% endif %}

        <a href="{{ url_for('patient_dashboard') }}" class="btn btn-secondary w-100 mt-2">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
