<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #f4f6fb; margin: 0; }
        .sidebar {
            width: 250px; height: 100vh; position: fixed; top:0; left:0;
            background: linear-gradient(180deg, #1e1b4b, #312e81);
            color: white; padding: 25px 18px;
        }
        .sidebar h3 { font-weight: 700; margin-bottom: 35px; }
        .sidebar h3 span { color: #818cf8; }
        .sidebar a {
            display: flex; align-items: center; gap: 10px;
            color: #c7d2fe; text-decoration: none; padding: 12px 14px;
            border-radius: 10px; margin-bottom: 6px; font-size: 15px;
        }
        .sidebar a:hover, .sidebar a.active { background: #4338ca; color: white; }
        .main { margin-left: 250px; padding: 30px 40px; }
        .stat-card {
            border-radius: 16px; padding: 22px; color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .stat-card h2 { font-weight: 700; margin: 6px 0 0; }
        .stat-card i { font-size: 26px; opacity: 0.85; }
        .card-box {
            background: white; border-radius: 16px; padding: 22px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .live-dot {
            width: 9px; height: 9px; background: #22c55e; border-radius: 50%;
            display: inline-block; margin-right: 6px; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.3;} 100%{opacity:1;} }
    </style>
</head>
<body>

<div class="sidebar">
    <h3><span>Medi</span>Care</h3>
    <a href="#" class="active"><i class="bi bi-grid-fill"></i> Dashboard</a>
    <a href="{{ url_for('logout') }}" class="mt-4"><i class="bi bi-box-arrow-right"></i> Logout</a>
</div>

<div class="main">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Welcome, {{ user.name }} <span class="text-muted fs-6">({{ user.role }})</span></h3>
        <span class="text-muted small"><span class="live-dot"></span>Live data — auto-updating</span>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="stat-card" style="background:linear-gradient(120deg,#4f46e5,#6366f1);">
                <i class="bi bi-people-fill"></i>
                <p class="mb-0">Total Patients</p>
                <h2 id="totalPatients">-</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="background:linear-gradient(120deg,#059669,#10b981);">
                <i class="bi bi-heart-pulse-fill"></i>
                <p class="mb-0">Total Doctors</p>
                <h2 id="totalDoctors">-</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card" style="background:linear-gradient(120deg,#db2777,#f472b6);">
                <i class="bi bi-clipboard2-pulse-fill"></i>
                <p class="mb-0">Total Predictions</p>
                <h2 id="totalPredictions">-</h2>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card-box">
                <h6 class="mb-3">Disease-wise Predictions</h6>
                <canvas id="diseaseBarChart"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card-box">
                <h6 class="mb-3">Disease Distribution</h6>
                <canvas id="diseasePieChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card-box mt-4">
        <h6 class="mb-3">Appointments</h6>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    {% if user.role == 'doctor' %}<th>Action</th>{% endif %}
                </tr>
            </thead>
            <tbody id="appointmentsTable"></tbody>
        </table>
    </div>
</div>

<script>
let barChart, pieChart;

async function fetchStats() {
    const res = await fetch('/api/stats');
    const data = await res.json();

    document.getElementById('totalPatients').innerText = data.total_patients;
    document.getElementById('totalDoctors').innerText = data.total_doctors;
    document.getElementById('totalPredictions').innerText = data.total_predictions;

    const labels = Object.keys(data.disease_counts);
    const values = Object.values(data.disease_counts);

    if (barChart) {
        barChart.data.labels = labels;
        barChart.data.datasets[0].data = values;
        barChart.update();
    } else {
        const ctx1 = document.getElementById('diseaseBarChart').getContext('2d');
        barChart = new Chart(ctx1, {
            type: 'bar',
            data: { labels: labels, datasets: [{ label: 'Cases', data: values, backgroundColor: '#4f46e5', borderRadius: 6 }] },
            options: { plugins: { legend: { display: false } } }
        });
    }

    if (pieChart) {
        pieChart.data.labels = labels;
        pieChart.data.datasets[0].data = values;
        pieChart.update();
    } else {
        const ctx2 = document.getElementById('diseasePieChart').getContext('2d');
        pieChart = new Chart(ctx2, {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: values, backgroundColor: ['#4f46e5','#10b981','#f472b6','#f59e0b','#06b6d4','#ef4444'] }] }
        });
    }
}

async function fetchAppointments() {
    const res = await fetch('/api/appointments');
    const data = await res.json();
    const tbody = document.getElementById('appointmentsTable');
    const isDoctor = "{{ user.role }}" === "doctor";

    if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No appointments yet</td></tr>`;
        return;
    }

    tbody.innerHTML = data.map(a => `
        <tr>
            <td>${a.patient_name}</td>
            <td>Dr. ${a.doctor_name}</td>
            <td>${a.date}</td>
            <td>${a.time}</td>
            <td><span class="badge bg-${a.status === 'Confirmed' ? 'success' : a.status === 'Rejected' ? 'danger' : 'warning'}">${a.status}</span></td>
            ${isDoctor ? `<td>
                <a href="/update-appointment/${a.id}/Confirmed" class="btn btn-sm btn-success">Accept</a>
                <a href="/update-appointment/${a.id}/Rejected" class="btn btn-sm btn-danger">Reject</a>
            </td>` : ''}
        </tr>
    `).join('');
}

fetchStats();
fetchAppointments();
setInterval(fetchStats, 8000);
setInterval(fetchAppointments, 8000);
</script>
</body>
</html>
